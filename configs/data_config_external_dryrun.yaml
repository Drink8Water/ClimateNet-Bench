# External-disk ERA5-Land dry-run configuration.
#
# This config intentionally narrows the "full" request to a small real-data
# window for validating preprocessing and benchmark plumbing before running the
# complete ERA5-Land experiment.

input_data_path: data/processed/sample_climate_data.csv
features_path: data/processed/features.csv
target_column: evaporation_anomaly
region_column: region
spatial_columns:
  - latitude
  - longitude
time_columns:
  - year
  - month
required_raw_columns:
  - region
  - year
  - month
  - latitude
  - longitude
  - temperature
  - precipitation
  - radiation
  - soil_moisture
  - u_wind
  - v_wind
  - evaporation
era5:
  dataset_name: reanalysis-era5-land-monthly-means
  raw_dir: /media/drink8water/拯救者PSSD/ClimateNet-Bench/data/raw/era5_land
  processed_path: /media/drink8water/拯救者PSSD/ClimateNet-Bench/data/processed/era5_climate_data_sahara_2019_2021.csv
  safe_default_years:
    - "2019"
  safe_default_months:
    - "01"
  full_years:
    - "2019"
    - "2020"
    - "2021"
  variables:
    - 2m_temperature
    - total_precipitation
    - surface_solar_radiation_downwards
    - total_evaporation
    - volumetric_soil_water_layer_1
    - 10m_u_component_of_wind
    - 10m_v_component_of_wind
  regions:
    Sahara:
      cds_area: [30.0, -20.0, 15.0, 30.0]
