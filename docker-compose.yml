services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: climatenet
      POSTGRES_USER: climatenet
      POSTGRES_PASSWORD: climatenet
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climatenet -d climatenet"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m backend.seed &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://climatenet:climatenet@postgres:5432/climatenet
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ARTIFACT_ROOT: /app/data/artifacts
    ports:
      - "8000:8000"
    volumes:
      - artifact-data:/app/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: >
      sh -c "python -m alembic upgrade head &&
             celery -A backend.celery_app.celery_app worker --loglevel=info"
    environment:
      DATABASE_URL: postgresql+psycopg2://climatenet:climatenet@postgres:5432/climatenet
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ARTIFACT_ROOT: /app/data/artifacts
    volumes:
      - artifact-data:/app/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  artifact-data:
